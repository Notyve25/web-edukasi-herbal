<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulir Peserta - Nutri Herbal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            --primary-color: #28a745;
            --secondary-color: #1ec3ff;
            --background-gradient: linear-gradient(120deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        }

        body {
            background: #f0f4f8;
            min-height: 100vh;
        }

        .navbar a.nav-link {
            color: rgba(255, 255, 255, 0.8) !important;
            transition: color 0.2s;
        }

        .navbar a.nav-link:hover,
        .navbar a.nav-link.active {
            color: #fff !important;
        }
        
        .dropdown-menu {
            background-color: var(--primary-color) !important;
        }

        .dropdown-item {
            color: #fff !important;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
            overflow: hidden;
        }

        .card-header {
            background: var(--background-gradient);
            color: #fff;
            padding: 1.25rem 1.5rem;
            border-bottom: none;
        }
        
        .card-header h2 {
            font-size: 1.5rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-label {
            font-weight: 600;
            color: #34495e;
        }

        .input-group-text {
            background-color: #e9ecef;
            border-right: none;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.2);
            border-color: var(--primary-color);
        }

        .preview-img {
            display: none;
            margin-top: 1rem;
            max-width: 150px;
            border-radius: 8px;
            border: 3px solid #eee;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 600;
            padding: 0.75rem;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-primary:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            font-weight: 600;
            padding: 0.75rem;
        }

        .spinner-border {
            width: 1.25rem;
            height: 1.25rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="awal.html">
                <i class="fa-solid fa-leaf me-2"></i>Nutri Herbal
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="awal.html"><i class="fa-solid fa-home"></i> Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="fa-solid fa-circle-info"></i> Informasi</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="vid.html"><i class="fa-solid fa-video"></i> Video Edukasi</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <i class="fa-solid fa-gears"></i> Pilihan
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="grafik.html"><i class="fa-solid fa-chart-column"></i>
                                    Grafik</a></li>
                            <li><a class="dropdown-item" href="form.html"><i class="fa-solid fa-file"></i> Formulir</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Form Content -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fa-solid fa-file-alt"></i> Formulir Data Peserta</h2>
                    </div>
                    <div class="card-body">
                        <form id="pesertaForm" novalidate>
                            <fieldset>
                                <legend class="h5 mb-4">Informasi Pribadi</legend>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="nama" class="form-label">Nama Lengkap</label>
                                        <div class="input-group">
                                            <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                                            <input type="text" class="form-control" id="nama" placeholder="Masukkan nama" required>
                                            <div class="invalid-feedback">Nama lengkap wajib diisi.</div>
                                        </div>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="tanggalLahir" class="form-label">Tanggal Lahir</label>
                                        <div class="input-group">
                                           <span class="input-group-text"><i class="fa-solid fa-calendar-day"></i></span>
                                           <input type="date" class="form-control" id="tanggalLahir" required>
                                           <div class="invalid-feedback">Tanggal lahir wajib diisi.</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="alamat" class="form-label">Alamat</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fa-solid fa-map-marker-alt"></i></span>
                                        <textarea class="form-control" id="alamat" rows="2" placeholder="Masukkan alamat lengkap" required></textarea>
                                        <div class="invalid-feedback">Alamat wajib diisi.</div>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label class="form-label">Jenis Kelamin</label>
                                    <div class="p-3 bg-light border rounded-3">
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="jenisKelamin" id="pria" value="Pria" required>
                                            <label class="form-check-label" for="pria"><i class="fa-solid fa-mars me-2"></i>Pria</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="jenisKelamin" id="wanita" value="Wanita" required>
                                            <label class="form-check-label" for="wanita"><i class="fa-solid fa-venus me-2"></i>Wanita</label>
                                        </div>
                                    </div>
                                     <div class="d-none invalid-feedback" id="gender-feedback">Pilih salah satu jenis kelamin.</div>
                                </div>
                            </fieldset>

                            <fieldset>
                                <legend class="h5 mb-3">Dokumentasi</legend>
                                <div class="mb-3">
                                    <label for="dokumentasiPeserta" class="form-label">Unggah Foto (Opsional)</label>
                                    <input type="file" class="form-control" id="dokumentasiPeserta" accept="image/*">
                                    <div class="text-center">
                                       <img id="previewImg" class="preview-img" alt="Preview Foto Peserta">
                                    </div>
                                </div>
                            </fieldset>
                            
                            <hr class="my-4">

                            <div class="row">
                                <div class="col-6">
                                     <button type="reset" class="btn btn-secondary w-100">Reset</button>
                                </div>
                                <div class="col-6">
                                    <button type="submit" class="btn btn-primary w-100">
                                        <span id="btnText">Simpan Data</span>
                                        <div id="btnLoading" class="spinner-border spinner-border-sm d-none" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('pesertaForm');
            const preview = document.getElementById('previewImg');
            const fileInput = document.getElementById('dokumentasiPeserta');
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const genderFeedback = document.getElementById('gender-feedback');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    preview.src = URL.createObjectURL(file);
                    preview.style.display = 'block';
                } else {
                    preview.src = '';
                    preview.style.display = 'none';
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                e.stopPropagation();

                // Custom validation for radio buttons
                const isGenderSelected = form.querySelector('input[name="jenisKelamin"]:checked');
                if (!isGenderSelected) {
                    genderFeedback.classList.remove('d-none');
                } else {
                    genderFeedback.classList.add('d-none');
                }
                
                if (!form.checkValidity() || !isGenderSelected) {
                    form.classList.add('was-validated');
                    return;
                }

                // UI feedback for loading
                btnText.textContent = 'Menyimpan...';
                btnLoading.classList.remove('d-none');
                const submitButton = form.querySelector('button[type="submit"]');
                submitButton.disabled = true;

                setTimeout(() => {
                    alert('Data berhasil disimpan!');
                    
                    // Reset UI
                    btnText.textContent = 'Simpan Data';
                    btnLoading.classList.add('d-none');
                    submitButton.disabled = false;
                    form.reset();
                    form.classList.remove('was-validated');
                    preview.style.display = 'none';
                    preview.src = '';
                }, 1500);
            });
            
            form.addEventListener('reset', () => {
                 form.classList.remove('was-validated');
                 genderFeedback.classList.add('d-none');
                 preview.style.display = 'none';
                 preview.src = '';
            });
        });
    </script>
</body>

</html>
